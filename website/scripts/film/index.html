<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ramose — How a query is made</title>
    <style>
      @font-face {
        font-family: "Manrope Variable";
        font-style: normal;
        font-weight: 200 800;
        src: url("./manrope-latin.woff2") format("woff2-variations");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6,
          U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122,
          U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      html,
      body {
        margin: 0;
        background: #0d0d0d;
        overflow: hidden;
        height: 100%;
        font-family: "Manrope Variable", Inter, "Avenir Next", sans-serif;
      }
      canvas {
        display: block;
        width: 1920px;
        height: 1080px;
      }
      #hud {
        position: fixed;
        left: 16px;
        bottom: 16px;
        color: #a6a6a6;
        font-size: 12px;
        letter-spacing: 0.08em;
        z-index: 2;
        pointer-events: none;
        text-transform: uppercase;
      }
      body.record #hud {
        display: none;
      }
    </style>

    <canvas id="stage" width="1920" height="1080"></canvas>
    <div id="hud">space play · arrows scrub · r restart</div>
