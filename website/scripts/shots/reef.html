<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Reef light-theme docs shots</title>
    <style>
      :root {
        --bg: #f4f6f9;
        --bg-raised: #eceff4;
        --surface: #ffffff;
        --surface-hover: #f3f5f9;
        --surface-active: #e9edf4;
        --border: #dde2ea;
        --border-strong: #c6cdd9;
        --text: #151922;
        --muted: #5b6577;
        --faint: #8a93a4;
        --accent: #3d6bff;
        --accent-hover: #2f5ae8;
        --accent-soft: rgba(61, 107, 255, 0.1);
        --ok: #1f9d55;
        --ok-soft: rgba(31, 157, 85, 0.12);
        --warn: #b8730a;
        --warn-soft: rgba(196, 125, 14, 0.14);
        --danger: #d64550;
        --danger-soft: rgba(214, 69, 80, 0.1);
        --overlay: rgba(23, 28, 38, 0.4);
        --shadow: 0 16px 48px rgba(23, 28, 38, 0.18), 0 2px 8px rgba(23, 28, 38, 0.08);
        --shadow-sm: 0 1px 2px rgba(23, 28, 38, 0.06), 0 4px 14px rgba(23, 28, 38, 0.06);
        --glow-a: rgba(61, 107, 255, 0.16);
        --glow-b: rgba(20, 184, 166, 0.12);
        --sans: Inter, ui-sans-serif, system-ui, sans-serif;
        --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        font-family: var(--sans);
        color: var(--text);
        background: var(--bg);
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }
      button, input, textarea, select { font: inherit; color: inherit; }
      .shot { display: none; overflow: hidden; background: var(--bg); }
      body[data-shot] .shot { display: none; }
      body[data-shot="board"] #shot-board,
      body[data-shot="denied-toast"] #shot-denied,
      body[data-shot="issue-detail"] #shot-detail,
      body[data-shot="masked-note"] #shot-masked,
      body[data-shot="masked-note-compare"] #shot-compare,
      body[data-shot="time-travel"] #shot-travel,
      body[data-shot="workspaces"] #shot-workspaces,
      body[data-shot="workspace-create"] #shot-create,
      body[data-shot="sign-in"] #shot-signin,
      body[data-shot="invite"] #shot-invite,
      body[data-shot="live-sync-a"] #shot-sync-a,
      body[data-shot="live-sync-b"] #shot-sync-b { display: block; }

      .app { display: flex; flex-direction: column; height: 100%; }
      .header {
        display: flex; align-items: center; gap: 8px; height: 52px;
        padding: 0 12px; border-bottom: 1px solid var(--border);
        background: var(--bg-raised); flex-shrink: 0;
      }
      .ws-name { font-weight: 700; font-size: 16px; }
      .ws-slug { font-family: var(--mono); font-size: 11px; color: var(--faint); margin-left: 4px; }
      .grow { flex: 1; }
      .live {
        display: inline-flex; align-items: center; gap: 6px; font-size: 11px;
        font-weight: 600; color: var(--muted); padding: 3px 8px; border-radius: 999px;
        border: 1px solid var(--border); background: var(--surface);
        font-variant-numeric: tabular-nums; margin-right: 4px;
      }
      .dot { width: 7px; height: 7px; border-radius: 99px; background: var(--ok); }
      .dot.warn { background: var(--warn); }
      .live-mono { font-family: var(--mono); color: var(--faint); font-weight: 500; }
      .divider { width: 1px; height: 20px; background: var(--border); margin: 0 4px; }

      .icon-btn, .btn {
        display: inline-flex; align-items: center; justify-content: center; gap: 6px;
        border: 1px solid transparent; border-radius: 6px; background: transparent;
        padding: 6px 12px; font-size: 12.5px; font-weight: 600; line-height: 1.3;
      }
      .btn.ghost { background: var(--surface); border-color: var(--border); color: var(--text); }
      .btn.subtle { color: var(--muted); }
      .btn.primary { background: var(--accent); color: #fff; box-shadow: inset 0 1px 0 rgba(255,255,255,0.14); }
      .btn.sm { padding: 3px 8px; font-size: 11px; border-radius: 4px; }
      .icon-btn { width: 28px; height: 28px; padding: 0; color: var(--muted); }
      .icon-btn.sm { width: 24px; height: 24px; }

      .tag {
        display: inline-flex; align-items: center; gap: 4px; font-size: 11px;
        font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em;
        border-radius: 999px; padding: 2px 8px; line-height: 1.5;
      }
      .tag.accent { background: var(--accent-soft); color: var(--accent); }
      .tag.ok { background: var(--ok-soft); color: var(--ok); }
      .tag.neutral { background: var(--surface-active); color: var(--muted); }
      .tag.warn { background: var(--warn-soft); color: var(--warn); }

      .mark {
        display: inline-flex; align-items: center; justify-content: center;
        border-radius: 10px; color: #fff; flex-shrink: 0;
        background: linear-gradient(135deg, #5b8cff 0%, #2dd4bf 100%);
        box-shadow: 0 4px 14px rgba(91, 140, 255, 0.35);
      }
      .lockup { display: inline-flex; align-items: center; gap: 8px; }
      .wordmark { font-weight: 800; letter-spacing: -0.03em; }

      .avatar {
        display: inline-flex; align-items: center; justify-content: center;
        border-radius: 99px; font-weight: 700; color: #fff; flex-shrink: 0;
        letter-spacing: 0.02em; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.12);
      }

      .board { display: flex; gap: 12px; align-items: stretch; flex: 1; min-height: 0; padding: 16px; }
      .col {
        display: flex; flex-direction: column; flex: 1 0 0; min-width: 236px;
        background: var(--bg-raised); border: 1px solid var(--border); border-radius: 14px;
      }
      .col-head { display: flex; align-items: center; gap: 8px; padding: 10px 8px 10px 12px; }
      .col-dot {
        width: 8px; height: 8px; border-radius: 99px; flex-shrink: 0;
        box-shadow: 0 0 0 3px color-mix(in srgb, currentColor 18%, transparent);
      }
      .col-title { font-size: 12.5px; font-weight: 700; }
      .col-count {
        font-size: 11px; font-weight: 600; color: var(--muted); font-family: var(--mono);
        background: var(--surface-active); border-radius: 99px; padding: 1px 7px;
        line-height: 1.6; min-width: 22px; text-align: center;
      }
      .cards { display: flex; flex-direction: column; gap: 8px; padding: 4px 8px 8px; }
      .empty-col {
        display: flex; align-items: center; justify-content: center; height: 64px;
        margin: 4px; border: 1px dashed var(--border); border-radius: 10px;
        color: var(--faint); font-size: 12.5px;
      }
      .card {
        background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
        padding: 10px 12px; display: flex; flex-direction: column; gap: 8px;
        box-shadow: var(--shadow-sm);
      }
      .card.selected { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(61, 107, 255, 0.3); }
      .card-top { display: flex; align-items: center; gap: 8px; min-height: 22px; }
      .card-id { font-family: var(--mono); font-size: 11px; color: var(--faint); }
      .card-title { font-size: 14px; font-weight: 500; line-height: 1.4; margin: 0; }
      .card-meta { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
      .lbl {
        display: inline-flex; align-items: center; gap: 5px; border-radius: 99px;
        padding: 1px 8px; font-size: 11px; font-weight: 600; line-height: 1.7;
        border: 1px solid transparent; white-space: nowrap;
      }
      .lbl-dot { width: 6px; height: 6px; border-radius: 99px; flex-shrink: 0; }

      .main { display: flex; flex: 1; min-height: 0; position: relative; }
      .board-wrap { display: flex; flex-direction: column; flex: 1; min-width: 0; min-height: 0; }

      .panel {
        width: 400px; flex-shrink: 0; border-left: 1px solid var(--border);
        background: var(--bg-raised); display: flex; flex-direction: column; overflow: hidden;
      }
      .panel-head {
        display: flex; align-items: center; gap: 8px; padding: 10px 16px;
        border-bottom: 1px solid var(--border);
      }
      .panel-id { font-family: var(--mono); font-size: 12.5px; color: var(--muted); font-weight: 500; }
      .panel-body { padding: 16px; display: flex; flex-direction: column; gap: 24px; overflow: hidden; }
      .issue-title { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.3; }
      .creator { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); }
      .creator b { color: var(--text); font-weight: 600; }
      .sec-label {
        display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700;
        text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); margin-bottom: 6px;
      }
      .meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      .full { grid-column: 1 / -1; }
      .field-box, .area {
        width: 100%; background: var(--surface); border: 1px solid var(--border);
        border-radius: 6px; padding: 7px 12px; font-size: 14px; color: var(--text);
      }
      .area { min-height: 72px; line-height: 1.5; color: var(--text); }
      .area.ph { color: var(--faint); }
      .chips { display: flex; flex-wrap: wrap; gap: 6px; }
      .chip {
        display: inline-flex; align-items: center; gap: 5px; border-radius: 99px;
        padding: 1px 8px; font-size: 11px; font-weight: 600; line-height: 1.7;
        border: 1px solid var(--border); color: var(--muted); background: transparent;
      }
      .chip.on { border-color: transparent; }
      .note-hint { display: flex; align-items: flex-start; gap: 6px; font-size: 11px; color: var(--faint); margin-top: 6px; line-height: 1.45; }
      code {
        font-family: var(--mono); font-size: 11px; background: var(--surface-active);
        border-radius: 4px; padding: 1px 5px;
      }
      .comment { display: flex; gap: 8px; align-items: flex-start; }
      .comment-author { font-weight: 600; font-size: 12.5px; }
      .comment-at { color: var(--faint); font-size: 11px; margin-left: 6px; }
      .comment-text { margin: 4px 0 0; font-size: 13px; line-height: 1.45; }

      .toast {
        position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
        display: flex; align-items: center; gap: 8px; background: var(--surface);
        border: 1px solid var(--border-strong); border-radius: 10px; box-shadow: var(--shadow);
        padding: 10px 16px; font-size: 14px; font-weight: 500; white-space: nowrap;
      }
      .toast-ico {
        display: inline-flex; align-items: center; justify-content: center;
        width: 22px; height: 22px; border-radius: 99px; background: var(--danger-soft); color: var(--danger);
      }

      .tt-bar {
        display: flex; align-items: center; gap: 16px; margin: 16px 16px 0;
        padding: 12px 16px; background: var(--accent-soft); border: 1px solid var(--accent);
        border-radius: 10px; box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 8%, transparent);
      }
      .tt-label { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 700; }
      .tt-slider { flex: 1; display: flex; align-items: center; gap: 8px; min-width: 200px; }
      .tt-bound { font-family: var(--mono); font-size: 11px; color: var(--faint); }
      .slider {
        flex: 1; height: 6px; border-radius: 99px; background:
          linear-gradient(90deg, var(--accent) 0 62%, var(--border-strong) 62% 100%);
        position: relative;
      }
      .slider::after {
        content: ""; position: absolute; left: 62%; top: 50%; transform: translate(-50%, -50%);
        width: 16px; height: 16px; border-radius: 99px; background: var(--accent);
        box-shadow: 0 0 0 4px var(--accent-soft);
      }
      .tt-t {
        font-family: var(--mono); font-size: 12.5px; font-weight: 500;
        background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
        padding: 3px 8px; font-variant-numeric: tabular-nums;
      }
      .tt-t span { color: var(--faint); }

      .ws-page { display: flex; flex-direction: column; height: 100%; }
      .ws-content { width: 600px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; padding: 7vh 24px 36px; }
      .hello { margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.02em; }
      .sub { margin: 0; color: var(--muted); font-size: 16px; line-height: 1.5; }
      .ws-card {
        background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
        box-shadow: var(--shadow-sm); padding: 24px;
      }
      .ws-card-head { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
      .ws-card-title {
        margin: 0; font-size: 11px; font-weight: 700; text-transform: uppercase;
        letter-spacing: 0.08em; color: var(--muted); flex: 1;
      }
      .ws-row {
        display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
        padding: 10px 12px; border-radius: 10px; background: var(--bg-raised);
        border: 1px solid var(--border);
      }
      .ws-list { display: flex; flex-direction: column; gap: 8px; }
      .tile {
        display: inline-flex; align-items: center; justify-content: center;
        width: 34px; height: 34px; border-radius: 6px; color: #fff; font-weight: 700;
        font-size: 12.5px; flex-shrink: 0; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.12);
      }
      .ws-name-lg { font-weight: 600; font-size: 16px; }
      .ws-slug-row { color: var(--faint); font-family: var(--mono); font-size: 11px; }
      .open { display: inline-flex; align-items: center; gap: 4px; color: var(--muted); font-size: 12.5px; font-weight: 600; }
      .create-row { display: flex; gap: 12px; align-items: flex-start; }
      .flabel { display: block; font-size: 11px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
      .slug-preview { margin-top: 6px; font-size: 11px; color: var(--faint); display: flex; align-items: center; gap: 4px; min-height: 20px; }
      .who { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); }
      .who b { color: var(--text); font-weight: 600; }

      .auth {
        position: relative; height: 100%; display: flex; align-items: center; justify-content: center;
        overflow: hidden;
      }
      .glow { position: absolute; pointer-events: none; }
      .glow-a {
        width: 820px; height: 820px; top: -300px; left: calc(50% - 640px);
        background: radial-gradient(closest-side, var(--glow-a), transparent);
      }
      .glow-b {
        width: 720px; height: 720px; bottom: -300px; right: calc(50% - 600px);
        background: radial-gradient(closest-side, var(--glow-b), transparent);
      }
      .auth-card {
        position: relative; width: 420px; background: var(--surface); border: 1px solid var(--border);
        border-radius: 20px; box-shadow: var(--shadow); padding: 36px;
      }
      .auth h1 { margin: 16px 0 0; font-size: 20px; font-weight: 700; letter-spacing: -0.01em; }
      .tagline { margin: 4px 0 24px; color: var(--muted); font-size: 12.5px; line-height: 1.55; }
      .switch { margin-top: 16px; font-size: 12.5px; color: var(--muted); text-align: center; }
      .switch a { color: var(--accent); font-weight: 600; }
      .features {
        display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 24px;
        padding-top: 16px; border-top: 1px solid var(--border);
      }
      .feat { font-size: 11px; color: var(--faint); line-height: 1.4; }
      .feat-h { display: flex; align-items: center; gap: 5px; color: var(--muted); font-weight: 600; margin-bottom: 3px; }
      .submit { display: grid; margin-top: 24px; }

      .overlay {
        position: absolute; inset: 0; background: var(--overlay); backdrop-filter: blur(6px);
        display: flex; align-items: flex-start; justify-content: center; padding-top: 12vh;
      }
      .dialog {
        width: 440px; background: var(--surface); border: 1px solid var(--border);
        border-radius: 14px; box-shadow: var(--shadow); padding: 20px 20px 16px;
      }
      .dialog-head { display: flex; align-items: center; margin-bottom: 16px; }
      .dialog h2 { margin: 0; font-size: 16px; font-weight: 700; flex: 1; }
      .dialog-foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 24px; }

      .win {
        border: 1px solid var(--border-strong); border-radius: 12px; overflow: hidden;
        box-shadow: var(--shadow); background: var(--bg); height: 100%;
        display: flex; flex-direction: column;
      }
      .win-bar {
        height: 28px; background: var(--bg-raised); border-bottom: 1px solid var(--border);
        display: flex; align-items: center; gap: 6px; padding: 0 10px; flex-shrink: 0;
      }
      .traffic { width: 10px; height: 10px; border-radius: 99px; }
      .win-title { font-size: 11px; color: var(--muted); font-weight: 600; margin-left: 6px; }
      .stack { display: flex; flex-direction: column; gap: 16px; padding: 16px; height: 100%; background: #d8dee8; }
      .stack .win { flex: 1; min-height: 0; }

      .compare { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 16px; height: 100%; background: var(--bg); }
      .compare-col { display: flex; flex-direction: column; min-height: 0; border: 1px solid var(--border); border-radius: 14px; overflow: hidden; background: var(--bg-raised); }
      .compare-h {
        font-size: 11px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase;
        padding: 10px 16px; border-bottom: 1px solid var(--border); color: var(--muted);
        background: var(--surface);
      }

      .status-dot { width: 8px; height: 8px; border-radius: 99px; display: inline-block; }
      .select-like {
        display: flex; align-items: center; justify-content: space-between;
        background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
        padding: 7px 12px; font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      const LABELS = {
        bug: "#ef5f6b",
        feature: "#5b8cff",
        design: "#b17aff",
        infra: "#3fb970",
      };
      const TINT = { backlog: "#8b93a3", todo: "#5b8cff", doing: "#f5a524", done: "#3fb970" };
      const STATUS = { backlog: "Backlog", todo: "Todo", doing: "In Progress", done: "Done" };
      const P_TINT = ["#6b7588", "#8b93a3", "#5b8cff", "#f5a524", "#ef5f6b"];
      const HUES = [212, 262, 152, 22, 330, 190, 52];
      const hueOf = (name) => {
        let hash = 0;
        for (const ch of name) hash = (hash * 31 + ch.codePointAt(0)) | 0;
        return HUES[Math.abs(hash) % HUES.length];
      };
      const initials = (name) => name.split(/\s+/).slice(0, 2).map((w) => w[0]).join("");
      const I = {
        plus: "M12 5v14M5 12h14",
        x: "M18 6 6 18M6 6l12 12",
        check: "M20 6 9 17l-5-5",
        chevronLeft: "m15 18-6-6 6-6",
        chevronDown: "m6 9 6 6 6-6",
        chevronRight: "m9 18 6-6-6-6",
        arrowRight: "M5 12h14m-7-7 7 7-7 7",
        moon: "M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z",
        history: "M3 12a9 9 0 1 0 2.64-6.36M3 3v5h5m4-1v5l3 2",
        lock: "M7 11V7a5 5 0 0 1 10 0v4M5 11h14v10H5z",
        trash: "M3 6h18M8 6V4h8v2m3 0-1 14H6L5 6m5 5v6m4-6v6",
        send: "M22 2 11 13m11-11-7 20-4-9-9-4 20-7z",
        userPlus: "M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zm10-3v6m3-3h-6",
        logout: "M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4m7 14 5-5-5-5m5 5H9",
        alert: "M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 6v4m0 4h.01",
        info: "M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 14v-4m0-4h.01",
        database: "M12 2c5 0 9 1.34 9 3s-4 3-9 3-9-1.34-9-3 4-3 9-3zM3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5M3 12c0 1.66 4 3 9 3s9-1.34 9-3",
        bolt: "M13 2 3 14h9l-1 8 10-12h-9l1-8z",
        message: "M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z",
      };
      const icon = (name, size = 16) =>
        `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="${I[name]}"/></svg>`;
      const wave = (s) =>
        `<svg width="${s * 0.62}" height="${s * 0.62}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M2 8c2.5 0 2.5 2.5 5 2.5S9.5 8 12 8s2.5 2.5 5 2.5S19.5 8 22 8"/><path d="M2 15c2.5 0 2.5 2.5 5 2.5s2.5-2.5 5-2.5 2.5 2.5 5 2.5 2.5-2.5 5-2.5"/></svg>`;
      const mark = (s = 22) => `<span class="mark" style="width:${s}px;height:${s}px">${wave(s)}</span>`;
      const logo = (s = 34) => `<span class="lockup">${mark(s)}<span class="wordmark" style="font-size:${s * 0.72}px">Reef</span></span>`;
      const avatar = (name, size = 22) => {
        const font = size <= 22 ? 10 : size <= 28 ? 12 : 15;
        return `<span class="avatar" title="${name}" style="width:${size}px;height:${size}px;font-size:${font}px;background:hsl(${hueOf(name)} 46% 46%)">${initials(name)}</span>`;
      };
      const prio = (level) => {
        const tint = P_TINT[level] ?? P_TINT[0];
        if (level >= 4) {
          return `<svg width="14" height="14" viewBox="0 0 16 16"><rect x="1.5" y="1.5" width="13" height="13" rx="3" fill="${tint}"/><path d="M8 4.5v4.2M8 11.4v.1" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>`;
        }
        const bars = [{ x: 2, h: 5 }, { x: 6.5, h: 8.5 }, { x: 11, h: 12 }];
        return `<svg width="14" height="14" viewBox="0 0 16 16">${bars.map((b, i) =>
          `<rect x="${b.x}" y="${14 - b.h}" width="3" height="${b.h}" rx="1" fill="${tint}" opacity="${level === 0 ? 0.28 : i < level ? 1 : 0.22}"/>`
        ).join("")}</svg>`;
      };
      const lbl = (name) => {
        const c = LABELS[name];
        return `<span class="lbl" style="background:${c}1f;color:${c};border-color:${c}33"><span class="lbl-dot" style="background:${c}"></span>${name}</span>`;
      };
      const chip = (name, on) => {
        const c = LABELS[name];
        const style = on ? `background:${c}1f;color:${c};border-color:${c}55` : "";
        return `<span class="chip ${on ? "on" : ""}" style="${style}"><span class="lbl-dot" style="background:${c};opacity:${on ? 1 : 0.55}"></span>${name}${on ? icon("check", 11) : ""}</span>`;
      };

      const ISSUES = [
        { id: 12, title: "Live board flickers when two tabs move the same card", status: "doing", priority: 4, labels: ["bug"], assignee: "Ada Lovelace" },
        { id: 13, title: "Add keyboard shortcuts for moving issues between columns", status: "todo", priority: 2, labels: ["feature"] },
        { id: 14, title: "Design pass on the issue detail panel", status: "doing", priority: 3, labels: ["design"], assignee: "Ada Lovelace" },
        { id: 15, title: "Rotate the JWKS signing key on a schedule", status: "backlog", priority: 3, labels: ["infra"] },
        { id: 16, title: "Empty-state illustration for new workspaces", status: "backlog", priority: 1, labels: ["design", "feature"] },
        { id: 17, title: "Time-travel slider should snap to transaction boundaries", status: "todo", priority: 2, labels: ["feature", "bug"], assignee: "Ada Lovelace" },
        { id: 18, title: "Show who is online in the workspace header", status: "backlog", priority: 0, labels: ["feature"] },
        { id: 19, title: "Ship the peer to three regions", status: "done", priority: 3, labels: ["infra"], assignee: "Ada Lovelace" },
        { id: 20, title: "Per-datom policy for issue.privateNote", status: "done", priority: 2, labels: ["infra", "feature"] },
      ];
      const PAST = ISSUES.filter((i) => ["doing", "done"].includes(i.status) && i.id !== 14);
      const MOVED = ISSUES.map((i) => i.id === 12 ? { ...i, status: "done" } : i);

      const card = (row, selected) => `
        <article class="card${selected === row.id ? " selected" : ""}">
          <div class="card-top">${prio(row.priority)}<span class="card-id">#${row.id}</span><span class="grow"></span>${row.assignee ? avatar(row.assignee) : ""}</div>
          <p class="card-title">${row.title}</p>
          ${row.labels.length ? `<div class="card-meta">${row.labels.map(lbl).join("")}</div>` : ""}
        </article>`;
      const columns = (rows, selected = null, plus = true) =>
        ["backlog", "todo", "doing", "done"].map((status) => {
          const col = rows.filter((r) => r.status === status);
          return `<section class="col" aria-label="${STATUS[status]}">
            <header class="col-head">
              <span class="col-dot" style="background:${TINT[status]};color:${TINT[status]}"></span>
              <span class="col-title">${STATUS[status]}</span>
              <span class="col-count">${col.length}</span>
              <span class="grow"></span>
              ${plus ? `<span class="icon-btn sm">${icon("plus", 14)}</span>` : ""}
            </header>
            <div class="cards">${col.length ? col.map((r) => card(r, selected)).join("") : `<div class="empty-col">${plus ? "No issues" : "Nothing here at this point in time"}</div>`}</div>
          </section>`;
        }).join("");

      const header = ({ cls = "admin", ticks = 5, paused = false, invite = true, user = "Ada Lovelace" } = {}) => `
        <header class="header">
          <span class="icon-btn">${icon("chevronLeft")}</span>
          ${mark(22)}
          <span class="ws-name">Coral Reef Divers</span>
          <span class="ws-slug">db/coral-reef-divers</span>
          <span class="tag ${cls === "admin" ? "accent" : cls === "member" ? "ok" : "neutral"}">${cls}</span>
          <span class="grow"></span>
          <span class="live"><span class="dot${paused ? " warn" : ""}"></span>${paused ? "paused" : "live"}${ticks ? `<span class="live-mono">${ticks} ${ticks === 1 ? "tick" : "ticks"}</span>` : ""}</span>
          ${paused ? "" : `<button class="btn ghost sm">${icon("history", 13)} Time travel</button>`}
          ${invite && cls === "admin" ? `<button class="btn ghost sm">${icon("userPlus", 13)} Invite</button>` : ""}
          <span class="divider"></span>
          <span class="icon-btn">${icon("moon")}</span>
          ${avatar(user, 28)}
          <span class="icon-btn">${icon("logout")}</span>
        </header>`;

      const panel = ({ masked = false } = {}) => `
        <aside class="panel">
          <div class="panel-head">
            <span class="panel-id">#12</span>
            <span class="tag neutral"><span class="status-dot" style="background:${TINT.doing}"></span>In Progress</span>
            <span class="grow"></span>
            <span class="icon-btn">${icon("trash")}</span>
            <span class="icon-btn">${icon("x")}</span>
          </div>
          <div class="panel-body">
            <div>
              <h2 class="issue-title">Live board flickers when two tabs move the same card</h2>
              <div class="creator" style="margin-top:8px">${avatar("Ada Lovelace")}<span>opened by <b>Ada Lovelace</b> · Aug 18, 2026</span></div>
            </div>
            <div class="meta-grid">
              <div><div class="sec-label">Status</div><div class="select-like">In Progress ${icon("chevronDown", 14)}</div></div>
              <div><div class="sec-label">Priority</div><div class="select-like">Urgent ${icon("chevronDown", 14)}</div></div>
              <div class="full"><div class="sec-label">Assignee</div><div class="select-like">Ada Lovelace ${icon("chevronDown", 14)}</div></div>
              <div class="full"><div class="sec-label">Labels</div><div class="chips">${chip("bug", true)}${chip("design", false)}${chip("feature", false)}${chip("infra", false)}</div></div>
            </div>
            <div>
              <div class="sec-label">Description</div>
              <div class="area">Repro: open the board twice, drag one card in each tab within a second.</div>
            </div>
            <div>
              <div class="sec-label">${icon("lock", 12)} Admin note ${masked ? `<span class="tag warn">masked for member</span>` : ""}</div>
              <div class="area${masked ? " ph" : ""}">${masked ? "Read-masked for your class — a write here is denied by the peer" : "Overlay was dropping the other tab’s tx. Do not mention this on the customer status page."}</div>
              <div class="note-hint">${icon("info", 12)}<span><code>issue.privateNote</code> has a narrowed read rule — the peer redacts the datom itself for non-admins.</span></div>
            </div>
            <div>
              <div class="sec-label">${icon("message", 12)} Comments <span class="tag neutral">2</span></div>
              <div class="comment">${avatar("Ada Lovelace")}<div><span class="comment-author">Ada Lovelace</span><span class="comment-at">4:12 PM</span><p class="comment-text">Reproduced on staging — both cards jump, then one snaps back.</p></div></div>
            </div>
          </div>
        </aside>`;

      const boardApp = (opts = {}) =>
        `<div class="app">${header(opts)}<div class="main"><div class="board-wrap"><div class="board">${columns(opts.rows ?? ISSUES, opts.selected, opts.plus !== false)}</div></div>${opts.panel ?? ""}</div>${opts.extra ?? ""}</div>`;

      const windowed = (inner, title) =>
        `<div class="win"><div class="win-bar"><span class="traffic" style="background:#ff5f57"></span><span class="traffic" style="background:#febc2e"></span><span class="traffic" style="background:#28c840"></span><span class="win-title">${title}</span></div>${inner}</div>`;

      const workspaces = (name = "") => {
        const slug = name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
        return `<div class="ws-page">
          <div class="header">
            ${logo(24)}<span class="grow"></span>
            <span class="who">${avatar("Ada Lovelace")} <b>Ada Lovelace</b></span>
            <span class="icon-btn">${icon("moon")}</span>
            <span class="icon-btn">${icon("logout")}</span>
          </div>
          <div class="ws-content">
            <div>
              <h1 class="hello">Hi, Ada</h1>
              <p class="sub">Pick a workspace to open its board. Every workspace is its own Ramose database — <code>ramose.db(slug)</code> — created on the spot, no deploy.</p>
            </div>
            <section class="ws-card">
              <div class="ws-card-head"><h2 class="ws-card-title">Your workspaces</h2><span class="tag neutral">2</span></div>
              <div class="ws-list">
                <div class="ws-row"><span class="tile" style="background:hsl(${hueOf("coral-reef-divers")} 46% 46%)">CR</span><span class="grow"><div class="ws-name-lg">Coral Reef Divers</div><div class="ws-slug-row">db/coral-reef-divers</div></span><span class="open">Open ${icon("chevronRight", 14)}</span></div>
                <div class="ws-row"><span class="tile" style="background:hsl(${hueOf("kelp-forest")} 46% 46%)">KF</span><span class="grow"><div class="ws-name-lg">Kelp Forest</div><div class="ws-slug-row">db/kelp-forest</div></span><span class="open">Open ${icon("chevronRight", 14)}</span></div>
              </div>
            </section>
            <section class="ws-card">
              <div class="ws-card-head"><h2 class="ws-card-title">New workspace</h2></div>
              <div class="create-row">
                <div class="grow">
                  <label class="flabel">Name</label>
                  <div class="field-box" style="${name ? "" : "color:var(--faint)"}">${name || "Coral Team"}</div>
                  <div class="slug-preview">${slug ? `${icon("arrowRight", 11)}<code>ramose.db("${slug}").install()</code>` : "the name becomes the database"}</div>
                </div>
                <div style="padding-top:22px"><button class="btn primary">${icon("plus", 14)} Create</button></div>
              </div>
            </section>
          </div>
        </div>`;
      };

      const signin = `
        <div class="auth">
          <div class="glow glow-a"></div><div class="glow glow-b"></div>
          <div class="auth-card">
            ${logo(34)}
            <h1>Welcome back</h1>
            <p class="tagline">A live, multi-tenant issue tracker where every workspace is its own Ramose database.</p>
            <label class="flabel">Email</label>
            <div class="field-box" style="color:var(--faint);margin-bottom:16px">ada@example.com</div>
            <label class="flabel">Password</label>
            <div class="field-box" style="color:var(--faint)">at least 8 characters</div>
            <div class="submit"><button class="btn primary" style="padding:10px 12px">Sign in ${icon("arrowRight", 14)}</button></div>
            <div class="switch">New here? <a>Create one</a></div>
            <div class="features">
              <div class="feat"><div class="feat-h">${icon("bolt", 12)} Live</div>db.live streams every board.</div>
              <div class="feat"><div class="feat-h">${icon("database", 12)} Multi-tenant</div>One database per workspace.</div>
              <div class="feat"><div class="feat-h">${icon("history", 12)} Time travel</div>db.asOf(t) — nothing copied.</div>
            </div>
          </div>
        </div>`;

      const shots = {
        board: boardApp({ ticks: 5 }),
        "denied-toast": boardApp({
          cls: "viewer",
          invite: false,
          plus: false,
          user: "Grace Hopper",
          extra: `<div class="toast"><span class="toast-ico">${icon("alert", 13)}</span>remove denied on :issue/status</div>`,
        }),
        "issue-detail": boardApp({ ticks: 7, selected: 12, panel: panel() }),
        "masked-note": boardApp({ cls: "member", ticks: 4, invite: false, user: "Lin Park", selected: 12, panel: panel({ masked: true }) }),
        "masked-note-compare": `<div class="compare">
          <div class="compare-col"><div class="compare-h">Admin — note visible</div>${panel()}</div>
          <div class="compare-col"><div class="compare-h">Member — note masked</div>${panel({ masked: true })}</div>
        </div>`,
        "time-travel": `<div class="app">${header({ paused: true, ticks: 1, invite: true })}
          <div class="tt-bar">
            <span class="tt-label">${icon("history", 15)} Time travel</span>
            <div class="tt-slider"><span class="tt-bound">t=1</span><div class="slider"></div><span class="tt-bound">t=42</span></div>
            <span class="tt-t">db.asOf(<strong>27</strong>)<span> / 42</span></span>
            <button class="btn primary sm">${icon("bolt", 12)} Back to live</button>
          </div>
          <div class="main"><div class="board-wrap"><div class="board">${columns(PAST, null, false)}</div></div></div>
        </div>`,
        workspaces: workspaces(""),
        "workspace-create": workspaces("Tidepool"),
        "sign-in": signin,
        invite: `<div class="app" style="position:relative">${header({ ticks: 5 })}
          <div class="main"><div class="board-wrap"><div class="board">${columns(ISSUES)}</div></div></div>
          <div class="overlay"><div class="dialog">
            <div class="dialog-head"><h2>Invite to this workspace</h2><span class="icon-btn">${icon("x")}</span></div>
            <label class="flabel">Email</label>
            <div class="field-box" style="margin-bottom:16px">grace@example.com</div>
            <label class="flabel">Role</label>
            <div class="select-like">viewer — read-only by policy ${icon("chevronDown", 14)}</div>
            <div class="dialog-foot"><button class="btn subtle">Cancel</button><button class="btn primary">${icon("send", 13)} Send invite</button></div>
          </div></div>
        </div>`,
        "live-sync-a": `<div class="stack">
          ${windowed(boardApp({ ticks: 4 }), "Ada — Coral Reef Divers")}
          ${windowed(boardApp({ ticks: 4 }), "Ada — Coral Reef Divers")}
        </div>`,
        "live-sync-b": `<div class="stack">
          ${windowed(boardApp({ ticks: 5, rows: MOVED }), "Ada — Coral Reef Divers")}
          ${windowed(boardApp({ ticks: 5, rows: MOVED }), "Ada — Coral Reef Divers")}
        </div>`,
      };

      const params = new URLSearchParams(location.search);
      const shot = params.get("shot");
      document.body.dataset.shot = shot ?? "";
      const root = document.getElementById("root");
      if (shot && shots[shot]) {
        root.innerHTML = `<div class="shot" id="shot-${shot}" style="width:100%;height:100%">${shots[shot]}</div>`;
        document.getElementById(`shot-${shot}`).style.display = "block";
      } else {
        root.innerHTML = `<div style="padding:24px;font:14px var(--sans)"><p>Add ?shot= to the URL:</p><ul>${Object.keys(shots).map((k) => `<li><a href="?shot=${k}">${k}</a></li>`).join("")}</ul></div>`;
      }
    </script>
  </body>
</html>
