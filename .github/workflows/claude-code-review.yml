name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"
  # Kick off (or re-run) a review for an existing PR without pushing a new
  # commit: Actions → Claude Code Review → Run workflow.
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to review'
        required: true
        type: string

# One review at a time per PR: near-simultaneous trigger events (an opened
# plus a synchronize from the same push flow) were each starting a full
# runner for the same head SHA. The newest event wins; the superseded run
# is cancelled instead of burning ~90s discovering it's a duplicate.
concurrency:
  group: claude-review-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history so the review can diff against the base branch.
          # With fetch-depth: 1 there is no merge-base for
          # `git diff origin/master...HEAD` and diff commands fail.
          fetch-depth: 0
          # On manual dispatch the workflow runs from a branch ref, not the
          # PR merge ref, so check out the PR head explicitly.
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/pull/{0}/head', inputs.pr_number) || '' }}

      # Set up the same toolchain as CI so Claude can actually run the
      # test suite while reviewing instead of relying on code-path analysis.
      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number || inputs.pr_number }}'
          # The Actions sandbox has no interactive approval, so every tool the
          # review needs must be pre-approved here. Skill(code-review:code-review)
          # comes first for a reason: invoking the plugin command via the Skill
          # tool is the agent's opening move, and its denial was the silent
          # killer in every sub-minute "success" run (visible in the
          # permission_denials of run 32761542936 once show_full_output landed).
          # The rest covers the plugin command's own allowed-tools frontmatter
          # (gh pr/issue/search reads plus the inline-comment MCP tool), the
          # git reads it uses for diffs, and the project's verification
          # commands.
          #
          # Write/Edit and bunx tsc are allowed deliberately: the runner is
          # ephemeral and the job token is contents: read, so nothing written
          # here can reach the repo. Without them, run 32781344329 burned
          # ~19 denied Opus turns probing for a way to write a scratch type
          # fixture and run tsc directly (Write, Edit, heredocs, tee,
          # bun -e writeFileSync, four tsc spellings — all denied), and then
          # posted a lower-confidence review that admitted it never got
          # compiler output for its finding.
          #
          # Three known sandbox pitfalls, addressed by the appended system
          # prompt: piped/compound Bash commands are denied even when each base
          # command is allowed; a single denial must not end the review — the
          # 30s "success" runs that never posted anything all died that way;
          # and subagents default to running in the background, where "I'll
          # wait for them" ends the turn and the headless session terminates
          # on the spot (both PR #259 runs died that way — see the transcript
          # of run 32767035857).
          claude_args: >-
            --model claude-opus-5
            --allowedTools "Skill(code-review:code-review),mcp__github_inline_comment__create_inline_comment,Write,Edit,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh pr list:*),Bash(gh pr checks:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git status),Bash(git fetch:*),Bash(bun install:*),Bash(bun run typecheck),Bash(bun run test),Bash(bun run test:*),Bash(bun test:*),Bash(bun run build),Bash(bun run scripts/check-release.ts:*),Bash(bun run scripts/check-client-dts.ts),Bash(bunx tsc:*)"
            --append-system-prompt "This is a non-interactive CI run: tool calls outside the allowlist are denied automatically, and piped or compound Bash commands are denied even when each base command is allowed. Use plain single commands (for example: gh pr view 123 --comments, never piped through grep or head). A denied command is not a reason to stop or skip the review, but do not keep respelling the same operation either: after two denials for the same underlying operation, move on and use the best allowed alternative (or note the limitation in the review). The Write and Edit tools and bunx tsc are allowed — use them for scratch fixtures and targeted typechecks instead of shell redirection tricks. In this environment, ending your turn terminates the session immediately — there is no next user message, and any still-running background task or subagent is killed with its results discarded. Therefore: launch every subagent with run_in_background: false so the call blocks until its result is returned; never end your turn to 'wait for' background work; and only end your turn after the review's final output (the posted review or an explicit stop verdict) is complete. Independent subagents should be launched as multiple Agent calls in a single message so they run concurrently while still blocking — serialize only when one subagent's input depends on another's output. Pass these same rules along to every subagent you launch."
          # Surface Claude's execution transcript in the Actions log so a run
          # that posts nothing can be diagnosed instead of silently "passing".
          show_full_output: true
          # Cloud Agent / Cursor pushes are github.actor=cursor[bot]. Without
          # this the action fails closed: "Workflow initiated by non-human actor".
          # claude covers workflow_dispatch fired through the Claude GitHub app.
          allowed_bots: cursor,claude
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
