# Opt-in diagnostic lane. Never a required check, never triggered by a PR.
#
# `test:stress` measures the local runtime's transport behaviour (issue #551):
# how long the Alchemy/workerd proxy holds an idle keep-alive socket, whether
# it advertises that bound, and how a pooled `fetch` reuse aimed at it
# behaves. It reports rather than asserts, so the job's value is its log.
name: stress

on:
  # Dispatch only. Nothing triggers this automatically — it is expensive
  # (six conformance runs plus a ten-minute sweep) and its output is evidence,
  # not a gate. Selectable from the Actions tab once this file is on master.
  workflow_dispatch:
    inputs:
      rounds:
        description: Attempts per idle offset
        required: false
        default: "8"
      lanes:
        description: Concurrent pooled sockets aged in parallel
        required: false
        default: "12"
      repeats:
        description: How many times to repeat the whole run in this job
        required: false
        default: "1"

jobs:
  transport:
    name: transport forensics
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # Runner shape matters for a timing race; record it with the evidence.
      - name: Runner environment
        run: |
          nproc
          ulimit -a
          free -m
          cat /proc/sys/net/ipv4/tcp_fin_timeout
          docker info --format '{{.ServerVersion}}' 2>/dev/null || echo "no docker"
      - name: Transport forensics
        env:
          RAMOSE_STRESS_ROUNDS: ${{ inputs.rounds || 8 }}
          RAMOSE_STRESS_LANES: ${{ inputs.lanes || 12 }}
        run: |
          for i in $(seq 1 "${{ inputs.repeats || 1 }}"); do
            echo "::group::stress run $i"
            bun run test:stress
            echo "::endgroup::"
          done

  idle-ages:
    name: conformance idle ages
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Runner environment
        run: |
          nproc
          ulimit -a
          free -m
      # Runs the real conformance lane with `RAMOSE_TRACE_IDLE=1`, then reports
      # how close each reused connection came to the runtime's idle-close bound.
      # An `/op` at 5000-something ms is the #551 signature, whether or not the
      # run failed.
      - name: Conformance with idle tracing
        env:
          RAMOSE_TRACE_IDLE: "1"
        run: |
          set +e
          for i in $(seq 1 "${{ inputs.repeats || 6 }}"); do
            echo "::group::conformance run $i"
            bun run test:conformance 2>&1 | tee "conformance-$i.log"
            echo "::endgroup::"
          done
          echo "== reuses within 500ms of the 5000ms idle-close bound =="
          grep -h "^IDLE" conformance-*.log \
            | awk -F'idleBefore=' '{split($2,a,"ms"); if (a[1]+0 >= 4500 && a[1]+0 <= 5500) print}' \
            | head -80
          echo "== reuses lost before the Worker (reset or silently dropped) =="
          grep -h "^IDLE" conformance-*.log | grep -E -- "-> (reset|dropped)" | head -50
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conformance-idle-logs
          path: conformance-*.log
