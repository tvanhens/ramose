# Contributor License Agreement gate.
#
# Why this exists: the CLA in CLA.md grants the right to license Contributions
# under terms of the Maintainer's choosing. Without it, relicensing the project
# later (say, moving to FSL or dual-licensing under a company) would require
# tracking down and getting permission from every past contributor. That is
# effectively impossible after the fact, which is why the gate has to be in
# place before the first outside pull request lands — not after.
#
# Setup, one time:
#   1. Create an empty repo to hold signatures, e.g. tvanhens/cla-signatures.
#      A private repo is fine. It must exist before the first run.
#   2. Create a classic PAT with `repo` scope on an account with write access to
#      it, and add it as the CLA_SIGNATURES_TOKEN secret on this repo.
#   3. Adjust `remote-repository-name` below if you named it something else.
#
# Contributors sign by commenting on their PR:
#   I have read the CLA Document and I hereby sign the CLA
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  actions: write
  contents: read
  pull-requests: write
  statuses: write

jobs:
  cla:
    name: check
    runs-on: ubuntu-latest
    # Only run for the signature comment or for pull requests — not for every
    # comment on every issue.
    if: >
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request != null &&
       contains(github.event.comment.body, 'I have read the CLA Document and I hereby sign the CLA'))
    steps:
      - name: CLA Assistant
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_SIGNATURES_TOKEN }}
        with:
          path-to-document: https://github.com/tvanhens/ramose/blob/master/CLA.md
          path-to-signatures: signatures/version1/cla.json
          remote-organization-name: tvanhens
          remote-repository-name: cla-signatures
          branch: main
          allowlist: tvanhens,dependabot[bot]
          custom-notsigned-prcomment: >
            Thanks for the pull request! Before it can be merged, please read the
            [Contributor License Agreement](https://github.com/tvanhens/ramose/blob/master/CLA.md)
            and sign it by posting a comment below with exactly:
          custom-pr-sign-comment: "I have read the CLA Document and I hereby sign the CLA"
          custom-allsigned-prcomment: "All contributors have signed the CLA. ✍️"
