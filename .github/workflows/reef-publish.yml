# FROZEN — Reef is not deployed during the authorization redesign
# (issue #335, tracker #351). Do not re-enable this workflow until the
# dedicated rebuild and redeploy (#350).
#
# examples/reef is kept as a reference and is excluded from typecheck and
# unit tests. Later authorization PRs must not edit it to stay green.
#
# This file stays in the workflow list so the freeze is obvious: no push
# or pull_request trigger deploys Reef. A manual run refuses to publish.
name: Reef publish (frozen)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen:
    name: refuse-deploy
    runs-on: ubuntu-latest
    steps:
      - name: Reef production publish is frozen
        run: |
          echo "::error::Reef production publish is frozen during the authorization redesign (#335 / #351). Rebuild and redeploy is #350. This workflow does not deploy."
          exit 1
