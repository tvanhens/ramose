name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history so Claude can diff against the base branch.
          fetch-depth: 0

      # Set up the same toolchain as CI so Claude can run typecheck, tests,
      # and the build when responding to @claude requests.
      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Optional: Give a custom prompt to Claude. If this is not specified, Claude will perform the instructions specified in the comment that tagged it.
          # prompt: 'Update the pull request description to include a summary of changes.'

          # Pre-approve the project's own verification commands (mirroring
          # ci.yml) plus the git/gh read + comment commands Claude needs to
          # inspect PR diffs — interactive approval is unavailable in Actions,
          # so anything not listed here is denied outright.
          claude_args: '--allowedTools "Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git status),Bash(git fetch:*),Bash(bun install:*),Bash(bun run typecheck),Bash(bun run test),Bash(bun run test:*),Bash(bun test:*),Bash(bun run build),Bash(bun run scripts/check-release.ts:*),Bash(bun run scripts/check-client-dts.ts)"'

