name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:

          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          additional_permissions: |
            actions: read

          claude_args: >-
            --allowedTools "Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git status),Bash(git fetch:*),Bash(bun install:*),Bash(bun run typecheck),Bash(bun run test),Bash(bun run test:*),Bash(bun test:*),Bash(bun run build),Bash(bun run scripts/check-release.ts:*),Bash(bun run scripts/check-client-dts.ts)"
            --append-system-prompt "This is a non-interactive CI run: tool calls outside the allowlist are denied automatically, and piped or compound Bash commands are denied even when each base command is allowed. Use plain single commands. A denied command is not a reason to stop: retry with an allowed unpiped variant or an allowed alternative, and carry the task through to completion. In this environment, ending your turn terminates the session immediately — any still-running background task or subagent is killed with its results discarded. Launch every subagent with run_in_background: false so the call blocks until its result is returned, and never end your turn to 'wait for' background work. Pass these same rules along to every subagent you launch."
