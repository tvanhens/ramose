# Per-PR preview of the Reef demo (examples/reef/): deploy an isolated Alchemy
# stage `pr-<number>` on PRs that change what Reef *is*, post/update a PR
# comment with the SPA URL, and destroy the stage when the PR closes.
#
# Isolation from production is the whole point. `REEF_DOMAIN` is production
# (see reef-publish.yml + examples/reef/src/infra/domain.ts): set, it pins
# D1 / R2 / Worker names to `ramose-reef-*` and attaches reef.ramose.ai.
# This workflow never sets it. Preview gets Alchemy-generated names that
# embed the `pr-<n>` stage, and teardown destroys that stage only.
#
# URL shape: without a pinned hostname the peer URL exists only *after* a
# deploy, so this is the two-pass personal flow from examples/reef/README.md
# — deploy once, bake `VITE_RAMOSE_URL=<peerUrl>` into the SPA, deploy again
# so the built assets ship on the auth Worker. The human-facing URL is that
# auth Worker (workers.dev), not the peer. `/db/*` lives on the peer's own
# workers.dev host; CORS already allows the auth Worker via `api.url`.
#
# State: ALCHEMY_STATE=local, `.alchemy/` via the Actions cache — same as
# docs-preview.yml. Cloudflare-hosted state is not used (CI token lacks the
# Secrets Store + edge-preview scopes; see CONTRIBUTING.md).
#
# Teardown is belt-and-suspenders: `alchemy destroy` against the cached
# state, then leftover preview Workers named in the PR comment are deleted
# via the Cloudflare API — but only when the physical name is clearly this
# `pr-<n>` stage, never a prod pin (`ramose-reef-api` / `ramose-reef-peer`).
#
# Credentials: GitHub Environment "Development" — same as docs-preview.yml
# and reef-publish.yml. Token also needs Account / D1 / Edit (Better Auth).
name: Reef preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - "examples/reef/**"
      - "packages/ramose/**"
      - ".github/workflows/reef-preview.yml"

permissions:
  contents: read
  pull-requests: write

# Serialize per PR: a deploy and a teardown must never race on stack state.
concurrency:
  group: reef-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy-preview
    # Forks have no access to the Development environment secrets; skip cleanly.
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: Development
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install
        run: bun install --frozen-lockfile
      - name: Restore stack state
        uses: actions/cache/restore@v4
        with:
          path: .alchemy
          key: reef-preview-state-pr-${{ github.event.pull_request.number }}-${{ github.run_id }}
          restore-keys: |
            reef-preview-state-pr-${{ github.event.pull_request.number }}-
      - name: Deploy pr-${{ github.event.pull_request.number }} stage
        id: deploy
        env:
          CI: "1"
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ALCHEMY_STATE: local
          # Production-only. Must stay unset: a preview that inherits it would
          # adopt reef.ramose.ai and the pinned prod D1 / R2 / Workers.
          # Do not add `REEF_DOMAIN` here, even from vars.
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Need CLOUDFLARE_API_TOKEN (secret) and CLOUDFLARE_ACCOUNT_ID (variable or secret) on the Development environment. See CONTRIBUTING.md."
            exit 1
          fi
          unset REEF_DOMAIN
          STAGE="pr-${{ github.event.pull_request.number }}"

          extract_url() {
            local key="$1"
            grep -oE "${key}: \"https://[^\"]+\"" deploy.log | head -1 \
              | sed -E "s/^${key}: \"//; s/\"$//"
          }

          # `ramose`'s exports resolve `bun` → src but `default` → dist, and
          # Vite is not Bun: without this the SPA silently bundles whatever
          # packages/ramose/dist was left over from, while the peer Worker
          # (resolved by alchemy under Bun) ships current src.
          bun run scripts/build-packages.ts

          # Pass 1: mint (or update) the isolated Workers + D1 + R2. The peer
          # URL is only knowable after this, which is why personal deploys
          # are two passes — see examples/reef/README.md.
          bun alchemy deploy examples/reef/alchemy.run.ts \
            --stage "$STAGE" --yes | tee deploy.log

          PEER_URL="$(extract_url peerUrl)"
          API_URL="$(extract_url apiUrl)"
          if [ -z "$PEER_URL" ]; then
            echo "::error::Deploy finished but no peerUrl in the output."
            exit 1
          fi
          if [ -z "$API_URL" ]; then
            API_URL=$(grep -oE 'https://[a-zA-Z0-9._-]+\.workers\.dev' deploy.log \
              | grep -vF "$PEER_URL" | tail -1 || true)
          fi
          if [ -z "$API_URL" ]; then
            echo "::error::Deploy finished but no auth Worker (apiUrl) in the output."
            exit 1
          fi

          VITE_RAMOSE_URL="$PEER_URL" bunx vite build examples/reef

          # Pass 2: ship the SPA as the auth Worker's assets.
          bun alchemy deploy examples/reef/alchemy.run.ts \
            --stage "$STAGE" --yes | tee deploy.log

          PEER_URL="$(extract_url peerUrl)"
          API_URL="$(extract_url apiUrl)"
          if [ -z "$PEER_URL" ]; then
            echo "::error::Second deploy finished but no peerUrl in the output."
            exit 1
          fi
          if [ -z "$API_URL" ]; then
            API_URL=$(grep -oE 'https://[a-zA-Z0-9._-]+\.workers\.dev' deploy.log \
              | grep -vF "$PEER_URL" | tail -1 || true)
          fi
          if [ -z "$API_URL" ]; then
            echo "::error::Second deploy finished but no auth Worker (apiUrl) in the output."
            exit 1
          fi

          echo "url=$API_URL" >> "$GITHUB_OUTPUT"
          echo "peer_url=$PEER_URL" >> "$GITHUB_OUTPUT"
          echo "### Reef preview" >> "$GITHUB_STEP_SUMMARY"
          echo "$API_URL" >> "$GITHUB_STEP_SUMMARY"
      - name: Smoke-test the preview
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
          PEER_URL: ${{ steps.deploy.outputs.peer_url }}
        run: |
          # Fresh workers.dev hosts are eventually consistent; retry the
          # reef-publish.yml checks against the hosts this stage actually
          # shipped — never reef.ramose.ai.
          fail=0
          wait_code() {
            local url="$1" want="$2" label="$3"
            local code=""
            for _ in $(seq 1 20); do
              code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "$url" || echo 000)
              [ "$code" = "$want" ] && return 0
              sleep 3
            done
            echo "::error::$label returned $code (want $want) at $url"
            return 1
          }
          wait_json() {
            local url="$1" label="$2"
            local ct=""
            for _ in $(seq 1 20); do
              ct=$(curl -sS -o /dev/null -w '%{content_type}' --max-time 30 "$url" || echo "")
              case "$ct" in
                application/json*) return 0 ;;
              esac
              sleep 3
            done
            echo "::error::$label served '$ct' at $url — want application/json"
            return 1
          }
          wait_code "$PREVIEW_URL/" 200 "SPA" || fail=1
          wait_code "$PREVIEW_URL/api/auth/jwks" 200 "JWKS" || fail=1
          # /db/* is on the peer Worker (no REEF_DOMAIN route on the SPA host).
          wait_json "$PEER_URL/db/probe/info" "/db/*" || fail=1
          exit $fail
      # Save even when the deploy failed partway: the state still names
      # whatever was created, and teardown needs it to clean up.
      - name: Save stack state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .alchemy
          key: reef-preview-state-pr-${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Comment preview URL on the PR
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
          PEER_URL: ${{ steps.deploy.outputs.peer_url }}
        with:
          script: |
            const marker = "<!-- ramose-reef-preview -->";
            const body = [
              marker,
              `<!-- reef-preview-workers: ${process.env.PREVIEW_URL} ${process.env.PEER_URL} -->`,
              "## Reef preview deployed",
              "",
              `**URL:** ${process.env.PREVIEW_URL}`,
              "",
              `Built from ${context.payload.pull_request.head.sha.slice(0, 7)}.`,
              "",
              "---",
              "_Updates on every push; the preview is destroyed when this PR closes._",
            ].join("\n");
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  teardown:
    name: destroy-preview
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: Development
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install
        run: bun install --frozen-lockfile
      - name: Restore stack state
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: .alchemy
          key: reef-preview-state-pr-${{ github.event.pull_request.number }}-${{ github.run_id }}
          restore-keys: |
            reef-preview-state-pr-${{ github.event.pull_request.number }}-
      - name: Destroy pr-${{ github.event.pull_request.number }} stage
        if: steps.restore.outputs.cache-matched-key != ''
        env:
          CI: "1"
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ALCHEMY_STATE: local
        run: |
          unset REEF_DOMAIN
          # R2 empty-then-delete can 409 if list/delete races with recent puts.
          ok=""
          for attempt in $(seq 1 5); do
            if bun alchemy destroy examples/reef/alchemy.run.ts \
              --stage "pr-${{ github.event.pull_request.number }}" --yes; then
              ok=1
              break
            fi
            echo "destroy attempt ${attempt} failed; retrying..."
            sleep 5
          done
          [ -n "$ok" ] || {
            echo "::error::alchemy destroy failed for stage pr-${{ github.event.pull_request.number }}."
            exit 1
          }
      # Fallback for an evicted cache: the preview comment names the Workers
      # (workers.dev labels). Delete only names that embed this `pr-<n>` stage.
      - name: Delete any leftover preview Workers by name
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          PR="${{ github.event.pull_request.number }}"
          BODY=$(gh api "repos/${{ github.repository }}/issues/${PR}/comments" --paginate \
            --jq '.[] | select(.body | contains("<!-- ramose-reef-preview -->")) | .body' || true)
          if [ -z "$BODY" ]; then
            echo "No Reef preview comment; nothing to check."
            exit 0
          fi
          URLS=$(echo "$BODY" | grep -oE 'https://[a-zA-Z0-9._-]+\.workers\.dev' | sort -u || true)
          if [ -z "$URLS" ]; then
            echo "No workers.dev URL in the preview comment; nothing to check."
            exit 0
          fi
          fail=0
          while read -r URL; do
            NAME=$(echo "$URL" | sed -E 's#https://([^.]+)\..*#\1#')
            case "$NAME" in
              ramose-reef-api|ramose-reef-peer|ramose-reef-authdb|ramose-reef-store|ripple-docs)
                echo "refusing to delete prod-pinned name $NAME"
                continue
                ;;
              *-pr-"$PR"-*)
                ;;
              *)
                echo "skip $NAME (not stage pr-$PR)"
                continue
                ;;
            esac
            STATUS=$(curl -s -o /dev/null -w '%{http_code}' \
              -X DELETE "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$NAME?force=true" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
            # 200 = deleted now (cache must have been evicted), 404 = already gone.
            echo "DELETE $NAME -> $STATUS"
            if [ "$STATUS" != "200" ] && [ "$STATUS" != "404" ]; then
              echo "::error::Unexpected status $STATUS deleting leftover preview Worker $NAME."
              fail=1
            fi
          done <<EOF
$URLS
EOF
          exit $fail
      - name: Mark the preview comment as destroyed
        uses: actions/github-script@v7
        with:
          script: |
            const marker = "<!-- ramose-reef-preview -->";
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (!existing) return;
            await github.rest.issues.updateComment({
              ...context.repo,
              comment_id: existing.id,
              body: [
                marker,
                "## Reef preview destroyed",
                "",
                "This PR is closed; its preview stage has been torn down.",
              ].join("\n"),
            });
