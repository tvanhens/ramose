name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # Reef (examples/reef) is frozen during the authorization redesign
      # (#335 / #351). typecheck excludes it; test:unit does not run
      # examples/reef/test. Do not add it back until the rebuild (#350).
      - run: bun run typecheck
      - run: bun run test:doubles
      - run: bun run test:unit
      # Cited docs fences must extract from source. A drifted title, a
      # missing marker, or a transcribed block that no longer matches fails
      # the job (issue #200).
      - run: bun website/scripts/docs-check.mjs
      # Build the publishable output on every PR. Without this a change that
      # breaks the build (or an exports path) is only discovered at release
      # time, when a bad version number has already been burned.
      - run: bun run build
      - run: bun run scripts/check-release.ts --built

  local:
    name: local
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # Alchemy local mode (workerd + owned peer). Serial: one sidecar
      # per file. Runs as its own job so it does not erase unit-test
      # wall-clock (issue #331 / #329).
      - run: bun run test:local
